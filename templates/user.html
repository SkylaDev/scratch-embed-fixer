<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <link rel="canonical" href="https://scratch.mit.edu/users/{{ username }}">
        <meta http-equiv="refresh" content="0;url=https://scratch.mit.edu/users/{{ username }}">
        <meta property="theme-color" content="#F8AA36">

        <meta property="og:type" content="website">
        <meta property="og:title" content="{{ username }}">
        <meta property="og:description" content="{{ bio }}">
        <meta property="og:image" content="{{ avatar }}">
        <meta property="og:url" content="https://scratch.mit.edu/users/{{ username }}">
        <meta property="og:site_name" content="scratch.mit.edu">

        <link rel="icon" href="/static/favicon.ico">
    </head>
    <body>
        <h1>
            If you are not redirected automatically
            <a href="https://scratch.mit.edu/users/{{ username }}">click here!</a>
        </h1>
    </body>
</html>
